name: Deploy static build to GitHub Pages

# Builds the relay-mode static bundle (see scripts/build-static.mjs) and
# publishes ./out to GitHub Pages. The server/exe release pipeline
# (release.yml) is unaffected — this is the second distribution path.
#
# One-time setup: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels the in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static bundle
        run: npm run build:static
        env:
          # Project Pages URL — override for user sites (empty) or custom domains.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
        with:
          # One-time setup happens here: creates the Pages site with
          # "build using GitHub Actions" when it does not exist yet.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
