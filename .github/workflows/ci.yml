name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage reports
        uses: actions/upload-artifact@v5
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        # Ratchet: 780 warnings — tightened from 846 after the phase-8
        # deduplication pass (docs/DEBT_CLEANUP.md). Lower this threshold as
        # the codebase is cleaned up further.
        run: npm run lint -- --max-warnings=780

  type-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript check
        run: npm run type-check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Installs Chromium plus OS-level libraries (--with-deps) needed to run it.
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # prisma-setup (postinstall) intentionally skips `prisma db push` in CI,
      # so create the local SQLite database the app falls back to here.
      - name: Initialize SQLite test database
        run: npx prisma db push --schema=prisma/schema.sqlite.prisma --skip-generate
        env:
          DATABASE_URL: file:./db/custom.db

      # The Playwright config boots `npm run dev` itself (webServer option) and
      # runs single-worker because next dev does not tolerate parallel route
      # compilation churn. CI=true makes the config strict (forbidOnly, retries).
      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Static relay-mode e2e: the GitHub Pages bundle (out/) served under its base
  # path, driven against the real Python relay + SQLite. Covers the second
  # distribution path end to end (CORS, client-side KPI calculation).
  e2e-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Build static bundle
        run: npm run build:static

      # Boots scripts/serve-static.mjs + scripts/jira_relay.py itself
      # (webServer array in playwright.static.config.ts).
      - name: Run static relay-mode E2E tests
        run: npx playwright test --config=playwright.static.config.ts

      - name: Upload static Playwright report
        uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-static
          path: playwright-report/
          retention-days: 7

  # Standalone Windows relay exe (PyInstaller) — attached to every CI run so a
  # ready-to-ship jira-relay.exe is always available without a local Python.
  relay-exe:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # setup-python puts 3.11 first on PATH; the build script creates and
      # caches nothing itself, so each run compiles a fresh .venv-relay.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build relay exe (dist\jira-relay.exe)
        shell: cmd
        run: call build-relay-exe.bat

      - name: Upload relay exe artifact
        uses: actions/upload-artifact@v5
        with:
          name: jira-relay-exe-windows
          path: dist/jira-relay.exe
          if-no-files-found: error
          retention-days: 14
