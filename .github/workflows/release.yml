name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  ci-gate:
    name: Require green CI for the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the CI workflow to pass on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          echo "Waiting for CI workflow to complete on $SHA..."
          for attempt in $(seq 1 60); do
            JSON=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" --json status,conclusion 2>/dev/null || echo "[]")
            TOTAL=$(echo "$JSON" | jq 'length')
            DONE=$(echo "$JSON" | jq '[.[] | select(.status == "completed")] | length')
            if [ "$TOTAL" -gt 0 ] && [ "$DONE" -eq "$TOTAL" ]; then
              FAILED=$(echo "$JSON" | jq '[.[] | select(.conclusion != "success" and .conclusion != "skipped")] | length')
              if [ "$FAILED" -eq 0 ]; then
                echo "CI is green for $SHA — proceeding with the release."
                exit 0
              fi
              echo "::error::CI failed for $SHA — aborting the release."
              exit 1
            fi
            echo "CI not complete yet (attempt $attempt/60)..."
            sleep 20
          done
          echo "::error::Timed out waiting for CI on $SHA — aborting the release."
          exit 1

  build-macos:
    name: Build macOS Executable
    needs: [ci-gate]
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Build macOS Executable
        run: bash build-exe.sh

      - name: Package macOS Binary into Zip
        run: |
          cd dist
          zip -r "JIRA-ETL-Dashboard-macOS.zip" "JIRA ETL Dashboard"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v5
        with:
          name: macos-executable
          path: dist/JIRA-ETL-Dashboard-macOS.zip
          retention-days: 1

  build-windows:
    name: Build Windows Executable
    needs: [ci-gate]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Build Windows Executable
        shell: cmd
        run: build-exe.bat

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v5
        with:
          name: windows-executable
          path: dist/JIRA ETL Dashboard.exe
          retention-days: 1

  build-relay-exe:
    name: Build Windows Relay Executable
    needs: [ci-gate]
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Relay Executable
        shell: cmd
        run: call build-relay-exe.bat

      - name: Upload Relay Artifact
        uses: actions/upload-artifact@v5
        with:
          name: relay-executable
          path: dist/jira-relay.exe
          retention-days: 1

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-relay-exe]
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag != '' && github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/JIRA-ETL-Dashboard-macOS.zip
            release-assets/JIRA ETL Dashboard.exe
            release-assets/jira-relay.exe
